<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Job Analysis</title>
<style>
:root{--navy:#1f3864;--ink:#1d2433;--muted:#5b6475;--line:#d5dbe6;--bg:#f5f7fa;--card:#fff;--soft:#e8edf5;--good:#1b6e45;--goodbg:#e2f3ea;--bad:#9b2c2c;--badbg:#fbe9e9;--warn:#8a5a00;--warnbg:#fdf2d8}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header.top{background:var(--navy);color:#fff;padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand strong{font-size:17px}.brand span{opacity:.8;margin-left:10px;font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer}
button:hover{background:var(--soft)}
button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}button.primary:hover{background:#2c4c85}
button.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}button.ghost:hover{background:rgba(255,255,255,.12)}
button.del{color:var(--bad);border-color:transparent;background:transparent;padding:4px 8px}
button.small{padding:3px 9px;font-size:13px}
nav{background:#fff;border-bottom:1px solid var(--line);padding:0 12px;display:flex;flex-wrap:wrap}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;padding:11px 12px;background:none;color:var(--muted)}
nav button.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:600}
nav button .n{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;background:var(--soft);font-size:12px;margin-right:6px;color:var(--navy)}
main{max-width:1080px;margin:0 auto;padding:22px 20px 60px}
h1{font-size:22px;margin:0 0 4px;color:var(--navy)}h2{font-size:17px;margin:26px 0 8px;color:var(--navy)}
p.lead{color:var(--muted);margin:0 0 16px;max-width:75ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin:14px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:3px}
input[type=text],input[type=number],input[type=date],textarea,select{font:inherit;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:38px}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--navy);color:#fff;font-size:13px;font-weight:600}
td.num,th.num{text-align:center;width:44px;white-space:nowrap}
td.c,th.c{text-align:center}
.scroll{overflow-x:auto}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.b-good{background:var(--goodbg);color:var(--good)}.b-bad{background:var(--badbg);color:var(--bad)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-mute{background:var(--soft);color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.scales{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;font-size:13px}
.scales div{background:var(--soft);border-radius:6px;padding:8px 10px}.scales b{display:block;color:var(--navy)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.banner{background:var(--warnbg);color:var(--warn);border:1px solid #ecd79b;border-radius:8px;padding:10px 14px;margin-bottom:14px}
td.linked{background:var(--goodbg);font-weight:600}td.unlinked{color:var(--muted)}
.matrix select{min-width:52px;padding:4px}
.matrix th small{font-weight:400;display:block;max-width:110px}
#modal{position:fixed;inset:0;background:rgba(20,28,45,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
#modal.show{display:flex}#modal .box{background:#fff;border-radius:10px;padding:20px;max-width:640px;width:100%;max-height:90vh;overflow:auto}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:20px;display:none;z-index:10}
footer{max-width:1080px;margin:0 auto;padding:0 20px 30px;font-size:12px;color:var(--muted)}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:40px}.sign div{border-top:1px solid #000;padding-top:4px;font-size:13px}
.only-print{display:none}
@media print{.no-print{display:none!important}.only-print{display:block}body{background:#fff;font-size:11pt}main{max-width:none;padding:0}.card{border:0;padding:0}
 th{background:#ddd!important;color:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}input,select,textarea{border:0!important;padding:0!important;appearance:none;-webkit-appearance:none}h2{break-after:avoid}tr{break-inside:avoid}}
.langsw{display:inline-flex;margin-left:6px}.langsw button{padding:6px 9px;border-radius:0}.langsw button:first-child{border-radius:6px 0 0 6px}.langsw button:last-child{border-radius:0 6px 6px 0;border-left:0}
.langsw button[aria-pressed=true]{background:#fff;color:var(--navy);border-color:#fff;font-weight:600}
details.note{font-size:13px;color:var(--muted);margin-top:8px}details.note summary{cursor:pointer;color:var(--navy)}
.kind{display:inline-block;margin-left:6px}
#modal .box.wide{max-width:960px}
.rome-res{list-style:none;margin:8px 0 0;padding:0;max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.rome-res li{border-bottom:1px solid var(--line)}.rome-res li:last-child{border-bottom:0}
.rome-res button{display:block;width:100%;text-align:left;border:0;border-radius:0;padding:7px 10px;background:#fff}.rome-res button:hover{background:var(--soft)}
.rome-res .code{font-weight:600;color:var(--navy);margin-right:6px}
.rome-fiche dl{margin:8px 0}.rome-fiche dt{font-weight:600;color:var(--navy);margin-top:10px}.rome-fiche dd{margin:2px 0 0}
.rome-imp h3{font-size:15px;margin:16px 0 4px;color:var(--navy)}.rome-imp h4{font-size:13px;margin:10px 0 2px;color:var(--muted)}
.rome-imp table td{padding:4px 6px;vertical-align:middle}.rome-imp table td:first-child{width:28px;text-align:center}.rome-imp select{width:auto;padding:2px 4px}
.rome-imp tr.done{color:var(--muted)}
.rome-imp .sticky{position:sticky;bottom:-20px;background:#fff;padding:10px 0;border-top:1px solid var(--line);margin-top:12px}
html[lang=fr] select[data-rate]{font-size:14px;min-width:228px}
html[lang=fr] .matrix select[data-rate]{min-width:52px;font-size:inherit}
</style>
</head>
<body>
<header class="top no-print">
  <div class="brand"><strong>Open Job Analysis</strong><span id="brandSub"></span><span id="jobName"></span></div>
  <div class="tools">
    <button class="ghost" data-act="saveFile" data-i18n="saveFile">Save file</button>
    <button class="ghost" data-act="openFile" data-i18n="openFile">Open file</button>
    <button class="ghost" data-act="example" data-i18n="example">Load example</button>
    <button class="ghost" data-act="newProject" data-i18n="newProject">New</button>
    <span class="langsw" role="group" id="langsw" aria-label="Language / Langue"><button class="ghost" data-lang="fr" lang="fr" aria-pressed="false">FR</button><button class="ghost" data-lang="en" lang="en" aria-pressed="false">EN</button></span>
  </div>
</header>
<nav id="nav" class="no-print"></nav>
<main id="main"></main>
<footer class="no-print" id="foot"></footer>
<input type="file" id="file" accept=".json,application/json" hidden>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>
<script>
/*CORE-START*/
var Core = (function () {
  // English scale wording. The interface takes each language's wording from I18N; these are kept for code that uses Core directly.
  var SCALES = {
    taskImp: { label: 'Importance', q: 'How important is this task to the job?', opts: ['Not performed', 'Not important', 'Somewhat important', 'Important', 'Very important', 'Extremely important'] },
    taskFreq: { label: 'Frequency', q: 'How often is the task performed?', opts: ['Not performed', 'Every few months to yearly', 'Every few weeks to monthly', 'Every few days to weekly', 'Every few hours to daily', 'Hourly to many times each hour'] },
    compImp: { label: 'Importance', q: 'How important is this competency for effective job performance?', opts: ['Not applicable', 'Not important', 'Somewhat important', 'Important', 'Very important', 'Extremely important'] },
    compEntry: { label: 'Need at entry', q: 'When is this competency needed for effective job performance?', opts: ['Not applicable', 'Needed the first day', 'Must be acquired within the first 3 months', 'Must be acquired within the first 4–6 months', 'Must be acquired after the first 6 months'] },
    compDV: { label: 'Distinguishing value', q: 'How valuable is this competency for distinguishing superior from barely acceptable employees?', opts: ['Not applicable', 'Not valuable', 'Somewhat valuable', 'Valuable', 'Very valuable', 'Extremely valuable'] },
    link: { label: 'Linkage', q: 'How important is this competency for effective task performance?', opts: ['Not applicable', 'Not important', 'Somewhat important', 'Important', 'Very important', 'Extremely important'] }
  };
  var DEFAULT_CUTOFFS = { taskImp: 3, taskFreq: 3, rareImp: 4, compImp: 3, compEntry: 2, compDV: 3, link: 3 };
  var VERSION = 2;
  function rid() { return Math.random().toString(36).slice(2, 10); }
  // lang: the language the project's content is written in ('en' or 'fr'). Rater files open in it.
  function blank(lang) {
    return { kind: 'oja-project', version: VERSION, lang: lang === 'fr' ? 'fr' : 'en', id: rid(), job: { title: '', org: '', family: '', analyst: '', date: '', sources: '', dept: '', reportsTo: '', purpose: '' },
      tasks: [], competencies: [], raters: [], cutoffs: Object.assign({}, DEFAULT_CUTOFFS), decisions: {}, keepTasks: {}, seq: 1 };
  }
  // Opens any earlier file without losing anything: unknown fields (such as a task's origin or a competency's kind) are kept as they are.
  function normalize(p) {
    var b = blank();
    p = Object.assign(b, p || {});
    p.version = VERSION; p.lang = p.lang === 'fr' ? 'fr' : 'en';
    p.job = Object.assign({ title: '', org: '', family: '', analyst: '', date: '', sources: '' }, p.job || {});
    p.cutoffs = Object.assign({}, DEFAULT_CUTOFFS, p.cutoffs || {});
    p.tasks = p.tasks || []; p.competencies = p.competencies || []; p.decisions = p.decisions || {}; p.keepTasks = p.keepTasks || {};
    p.raters = (p.raters || []).map(function (r) { r.t = r.t || {}; r.c = r.c || {}; r.l = r.l || {}; return r; });
    return p;
  }
  function isNum(x) { return typeof x === 'number' && !isNaN(x); }
  // Mean of ratings, ignoring 0 ("not performed" / "not applicable"). null when nothing to average.
  function mean(vals) {
    var v = vals.filter(function (x) { return isNum(x) && x > 0; });
    if (!v.length) return null;
    return v.reduce(function (a, b) { return a + b; }, 0) / v.length;
  }
  function taskResults(p) {
    var c = p.cutoffs;
    return p.tasks.map(function (t, i) {
      var rs = p.raters.map(function (r) { return r.t && r.t[t.id]; }).filter(function (x) { return x && isNum(x.imp) && isNum(x.freq); });
      var n = rs.length;
      var np = rs.filter(function (x) { return x.imp === 0 || x.freq === 0; }).length;
      var eliminated = n > 0 && np >= n / 2;
      var imp = mean(rs.map(function (x) { return x.imp; })), freq = mean(rs.map(function (x) { return x.freq; }));
      var byRule = n > 0 && !eliminated && imp !== null && freq !== null && imp >= c.taskImp && freq >= c.taskFreq;
      // Rarely performed but very important (an emergency procedure, a year-end close): the frequency cutoff
      // would drop it, so it is flagged and the analyst decides whether to keep it as critical.
      var rare = n > 0 && !eliminated && !byRule && imp !== null && freq !== null && imp >= c.rareImp && freq < c.taskFreq;
      var kept = rare && !!(p.keepTasks && p.keepTasks[t.id]);
      return { id: t.id, no: i + 1, text: t.text, source: t.source, n: n, notPerformed: np, eliminated: eliminated, imp: imp, freq: freq, critical: byRule || kept, rare: rare, kept: kept };
    });
  }
  function compResults(p) {
    var c = p.cutoffs;
    return p.competencies.map(function (k, i) {
      var rs = p.raters.map(function (r) { return r.c && r.c[k.id]; }).filter(function (x) { return x && isNum(x.imp) && isNum(x.entry) && isNum(x.dv); });
      var n = rs.length;
      var imp = mean(rs.map(function (x) { return x.imp; })), entry = mean(rs.map(function (x) { return x.entry; })), dv = mean(rs.map(function (x) { return x.dv; }));
      var critical = n > 0 && imp !== null && entry !== null && imp >= c.compImp && entry <= c.compEntry;
      var distinguishing = critical && dv !== null && dv >= c.compDV;
      return { id: k.id, no: i + 1, name: k.name, definition: k.definition, source: k.source, n: n, imp: imp, entry: entry, dv: dv, critical: critical, distinguishing: distinguishing };
    });
  }
  // Which tasks and competencies go into the linkage matrix. A rater file carries a frozen list.
  function linkSets(p) {
    if (p.raterMode) return { tasks: p.linkTasks || [], comps: p.linkComps || [] };
    return { tasks: taskResults(p).filter(function (t) { return t.critical; }).map(function (t) { return t.id; }),
             comps: compResults(p).filter(function (k) { return k.critical; }).map(function (k) { return k.id; }) };
  }
  function linkResults(p) {
    var s = linkSets(p), cut = p.cutoffs.link, cells = {}, taskLinked = {}, compLinked = {}, rated = 0;
    s.tasks.forEach(function (t) {
      s.comps.forEach(function (k) {
        var key = t + '|' + k;
        var vals = p.raters.map(function (r) { return r.l && r.l[key]; }).filter(isNum);
        var avg = mean(vals), linked = avg !== null && avg >= cut;
        if (vals.length) rated++;
        cells[key] = { n: vals.length, avg: avg, linked: linked };
        if (linked) { taskLinked[t] = true; compLinked[k] = true; }
      });
    });
    return { tasks: s.tasks, comps: s.comps, cells: cells, rated: rated, total: s.tasks.length * s.comps.length,
      finalTasks: s.tasks.filter(function (t) { return taskLinked[t]; }), finalComps: s.comps.filter(function (k) { return compLinked[k]; }),
      droppedTasks: s.tasks.filter(function (t) { return !taskLinked[t]; }), droppedComps: s.comps.filter(function (k) { return !compLinked[k]; }) };
  }
  // File a rater fills in: no other rater's scores, so ratings stay independent.
  function raterPacket(p, raterId, round) {
    var r = p.raters.filter(function (x) { return x.id === raterId; })[0];
    var s = linkSets(p);
    var q = JSON.parse(JSON.stringify(p));
    q.raters = [JSON.parse(JSON.stringify(r))]; q.raterMode = true; q.round = round; q.decisions = {};
    q.linkTasks = round === 2 ? s.tasks : []; q.linkComps = round === 2 ? s.comps : [];
    return q;
  }
  function raterResponse(p) { return { kind: 'oja-response', projectId: p.id, round: p.round, rater: p.raters[0] }; }
  function mergeResponse(p, resp) {
    if (resp.projectId !== p.id) return 'errOtherProject';
    var r = p.raters.filter(function (x) { return x.id === resp.rater.id; })[0];
    if (!r) return 'errUnknownRater';
    if (resp.round === 2) r.l = Object.assign({}, r.l, resp.rater.l || {});
    else { r.t = resp.rater.t || {}; r.c = resp.rater.c || {}; if (resp.rater.e) r.e = resp.rater.e; }
    return null;
  }
  // Job evaluation profile (optional, p.eige): each job expert gives the level the job requires on the 14 subfactors of
  // the EU toolkit on gender-neutral job evaluation (EIGE). Levels run 0-5; knowledge runs 0-8. JobEval reads these.
  var EIGE_IDS = ["knowledge", "communication", "problemSolving", "planning", "physicalSkills", "people", "goods", "information", "financial", "mentalEffort", "emotionalEffort", "physicalEffort", "environment", "organisational"];
  var EIGE_MAX = { knowledge: 8 };
  // The five subfactors of the skills factor. A competency may name one of them (competency.subfactor) as the subfactor
  // it is evidence for; JobEval shows it there and compares its importance and links with the level agreed.
  var SKILL_IDS = EIGE_IDS.slice(0, 5);
  function eigeResults(p) {
    return EIGE_IDS.map(function (id) {
      var v = p.raters.map(function (r) { return r.e && r.e[id]; }).filter(function (x) { return isNum(x) && x >= 0; }).sort(function (a, b) { return a - b; });
      var n = v.length, m = Math.floor(n / 2);
      return { id: id, n: n, median: n ? (n % 2 ? v[m] : (v[m - 1] + v[m]) / 2) : null, min: n ? v[0] : null, max: n ? v[n - 1] : null, spread: n ? v[n - 1] - v[0] : null };
    });
  }
  // Display helpers. French uses a decimal comma.
  var NF = {};
  function fmtNum(x, lang) {
    if (x === null || x === undefined) return '–';
    if (lang === 'fr') { NF.fr = NF.fr || new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); return NF.fr.format(x); }
    return x.toFixed(2);
  }
  function fmtCut(x, lang) { return lang === 'fr' ? String(x).replace('.', ',') : String(x); }
  // File names: accents are removed first, so "Chargé de paie" becomes "charge-de-paie".
  function slug(s, fallback) {
    var f = fallback || 'job-analysis';
    return String(s || f).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/œ/g, 'oe').replace(/Œ/g, 'OE').replace(/æ/g, 'ae').replace(/Æ/g, 'AE')
      .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || f;
  }
  // CSV. French Excel expects a semicolon separator (numbers already carry a decimal comma).
  function toCSV(rows, lang) {
    var fr = lang === 'fr', sep = fr ? ';' : ',', re = fr ? /[";\n]/ : /[",\n]/;
    function q(x) { x = x === null || x === undefined ? '' : String(x); return re.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }
    return rows.map(function (r) { return r.map(q).join(sep); }).join('\r\n');
  }
  // An item imported from the ROME whose wording has not been changed yet.
  function needsReview(item) { return !!(item && item.origin && item.origin.type === 'rome' && item.origin.edited === false); }
  // ROME import. Search ignores accents and case.
  function fold(s) { return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/œ/g, 'oe').replace(/Œ/g, 'oe').replace(/æ/g, 'ae').replace(/Æ/g, 'ae').toLowerCase(); }
  // Turns a ROME profile (one data/rome/vN/CODE.js file) into a list of items the analyst can tick.
  // Savoir-faire: core items ticked, imported as tasks by default (the analyst can switch each to a competency).
  // Savoirs, certifications and savoir-être: unticked, imported as competencies of the matching kind.
  function romeItems(f) {
    var out = [];
    (f.sf || []).forEach(function (x, i) { out.push({ key: 'sf' + i, group: 'sf', cat: x[0], label: x[1], ogr: x[2], core: !!x[3], kind: 'savoir-faire', as: 'task', on: !!x[3] }); });
    (f.sv || []).forEach(function (x, i) { out.push({ key: 'sv' + i, group: 'sv', cat: x[0], label: x[1], ogr: x[2], core: !!x[3], kind: 'savoir', as: 'comp', on: false }); });
    (f.cert || []).forEach(function (x, i) { out.push({ key: 'ce' + i, group: 'cert', cat: '', label: x[0], ogr: x[1], core: false, kind: 'certification', as: 'comp', on: false }); });
    (f.se || []).forEach(function (x, i) { out.push({ key: 'se' + i, group: 'se', cat: '', label: x[0], ogr: x[1], core: false, kind: 'savoir-etre', as: 'comp', on: false }); });
    return out;
  }
  // ROME items already in the project, by OGR code.
  function romeOgrs(p) {
    var s = {};
    (p.tasks || []).concat(p.competencies || []).forEach(function (x) { if (x.origin && x.origin.type === 'rome' && x.origin.ogr != null) s[x.origin.ogr] = true; });
    return s;
  }
  // Adds the chosen items. Each keeps its origin (profile code, OGR code, ROME version) and stays flagged until edited.
  // Items already in the project (same OGR code) are skipped.
  function importRome(p, code, version, chosen, source) {
    var have = romeOgrs(p), added = 0, skipped = 0;
    chosen.forEach(function (it) {
      if (have[it.ogr]) { skipped++; return; }
      have[it.ogr] = true; added++;
      var origin = { type: 'rome', code: code, ogr: it.ogr, version: String(version), edited: false };
      if (it.as === 'task') p.tasks.push({ id: 't' + rid(), text: it.label, source: source || '', origin: origin });
      else {
        var kind = it.group === 'sf' ? 'savoir-faire' : it.kind;
        // Savoirs and certifications are knowledge; the analyst places the others.
        p.competencies.push({ id: 'c' + rid(), name: it.label, definition: '', source: source || '', kind: kind, subfactor: kind === 'savoir' || kind === 'certification' ? 'knowledge' : '', origin: origin });
      }
    });
    return { added: added, skipped: skipped };
  }
  // Whether the project uses the ROME at all (a chosen profile or any imported item): the report then carries the attribution.
  function romeUsed(p) {
    if (p.job && p.job.rome && p.job.rome.code) return true;
    return (p.tasks || []).concat(p.competencies || []).some(function (x) { return x.origin && x.origin.type === 'rome'; });
  }
  function romeVersion(p) {
    if (p.job && p.job.rome && p.job.rome.version) return String(p.job.rome.version);
    var o = (p.tasks || []).concat(p.competencies || []).filter(function (x) { return x.origin && x.origin.type === 'rome' && x.origin.version; })[0];
    return o ? String(o.origin.version) : '';
  }
  // Search over job titles. index.titles rows: [label, profile number, 0 usual | 1 profile title | 2 rarely used].
  function romeSearch(index, folded, q, max) {
    var words = fold(q).split(/[^a-z0-9]+/).filter(Boolean); if (!words.length) return { list: [], total: 0 };
    var codeQ = /^[a-z]\d{0,4}$/.test(words[0]) && words.length === 1 ? words[0].toUpperCase() : null;
    var seen = {}, hits = [];

nating the work and well-being of others. This may involve supervising, providing regular support, managing conflicts, responding to an individual’s needs and ensuring the personal and professional development of individuals.", "High level of responsibility for people. The job involves significant responsibility for the well-being and development of others. This includes making decisions that affect others’ jobs, tasks or welfare, such as managing teams, providing care, teaching or ensuring psychological safety. It can also include hiring, evaluating, motivating, coaching and leading workers.", "Full responsibility for people. The job involves complete responsibility and accountability for the well-being and development of others (including patients or children) and/or leading, directing and managing others, including setting objectives, making strategic decisions and overseeing the welfare and development of those under supervision. It includes hiring, firing, evaluating, motivating, training, developing staff, conducting pay reviews, determining pay and staffing levels, or managing complex care or support systems. The job involves overall accountability for managing an organisation’s entire workforce or a significant part of a large organisation."]}, {"id": "goods", "name": "Goods and equipment", "q": "What responsibility does the job have for goods and equipment?", "levels": ["Not applicable. The job does not involve any responsibility for goods or equipment.", "Limited responsibility for goods or equipment. The job involves the care and proper use of low-value tools or materials, with minimal responsibility for their maintenance or security.", "Some responsibility for goods or equipment. The job involves the use and maintenance of equipment or stock, and the job holder is responsible for ensuring resources are used appropriately and safely.", "Moderate responsibility for goods or equipment. The job involves the regular use and maintenance of more valuable equipment or materials. It may include managing resources or ensuring equipment stays in good condition.", "Considerable responsibility for goods or equipment. The job involves overseeing valuable resources, making sure they are secure, maintained and functioning to meet goals. This includes protecting important physical or natural assets and deciding on the ordering of various equipment and supplies.", "Full responsibility for goods or equipment. The job involves managing the entire life cycle of goods or equipment, including buying, maintenance, security and disposal. It may involve handling high-value or sensitive assets and planning for long-term resource needs. This includes ordering a wide range of valuable equipment and possibly adapting or designing equipment, buildings, land or other physical resources."]}, {"id": "information", "name": "Information", "q": "What responsibility does the job have for information, including confidential information?", "levels": ["Not applicable. The job does not require any responsibility for information.", "Very limited responsibility for information. The job involves using basic information to perform tasks, with little or no responsibility for sourcing, processing or safeguarding the information.", "Limited responsibility for information. The job requires the individual to gather, process or share information in a controlled way, following guidelines or predefined procedures.", "Moderate responsibility for information. The job involves managing information to ensure it is accurate, of high quality and secure. The job holder may make decisions about the handling of sensitive data.", "Considerable responsibility for information. The job manages large amounts of valuable or sensitive information, deciding what is needed and how it is used and ensuring it is protected.", "Full responsibility for information. The job has major responsibility for sourcing, analysing and deciding on information use, ensuring legal and strategic compliance, and overseeing how information is managed organisation-wide."]}, {"id": "financial", "name": "Financial resources", "q": "What responsibility does the job have for money and budgets?", "levels": ["Not applicable. The job does not require any responsibility for financial resources.", "Very limited responsibility for financial resources. The job involves handling small amounts of cash or processing simple transactions, such as recording expenses or maintaining basic financial records.", "Limited responsibility for financial resources. The job involves handling limited financial resources, such as managing small budgets, processing invoices or participating in financial planning discussions.", "Moderate responsibility for financial resources. The job requires handling significant financial resources, including managing budgets, overseeing expenditures, being accountable for spending and participating in financial decision-making.", "Considerable responsibility for financial resources. The job involves managing large budgets or financial portfolios, making decisions on allocations, or overseeing the financial integrity for a department or organisation. The job may include liaising with auditors or financial officers.", "Full responsibility for financial resources. The job involves taking complete responsibility for financial planning and oversight across the organisation, including setting budgets, developing financial policies, making strategic financial decisions affecting the entire organisation and liaising with external financial bodies or auditors."]}, {"id": "mentalEffort", "name": "Mental effort", "q": "How much concentration and mental effort does the job require?", "levels": ["Not applicable. The job does not require any significant mental effort or concentration.", "Limited mental effort. The job involves tasks that require only low levels of mental effort, such as basic attention and following simple instructions with few competing demands for attention.", "Moderate mental effort. The job involves tasks that require focus, such as analysing straightforward information or performing repetitive tasks that require attention to detail.", "High level of mental effort. The job involves frequent concentration on complex tasks that require considerable mental effort, such as interpreting complex data.", "Very high level of mental effort. The job requires continuous high-level mental concentration, with few or no breaks, involving intellectually demanding tasks that require continuous focus.", "Intense mental effort. The job involves sustained, intense mental effort for long periods, often requiring creative thinking and managing complex or novel problems."]}, {"id": "emotionalEffort", "name": "Psychosocial and emotional effort", "q": "How much emotional effort does the job require to manage your own emotions and responses?", "levels": ["Not applicable. The job does not require any psychosocial or emotional effort.", "Minimal psychosocial and emotional effort. There is little to no need to manage emotional responses. The job involves minimal exposure to emotionally demanding situations.", "Occasional psychosocial and emotional effort. The job requires occasional involvement in emotionally demanding situations, such as handling minor conflicts or dealing with upset individuals.", "Moderate psychosocial and emotional effort. The job requires the regular management of emotional responses, such as dealing with sensitive or challenging individuals or situations.", "High psychosocial and emotional effort. The job involves frequent exposure to emotionally charged situations, requiring significant resilience and managing personal emotions while interacting with others.", "Extreme psychosocial and emotional effort. The job involves constant exposure to highly emotional or stressful circumstances, requiring continuous emotional control and the ability to manage highly sensitive, vulnerable or distressed individuals."]}, {"id": "physicalEffort", "name": "Physical effort", "q": "How much physical effort (strength, stamina) does the job require?", "levels": ["Not applicable. The job does not require any physical effort.", "Minimal physical effort. The job involves light physical tasks, such as occasional lifting or moving light objects.", "Low physical effort. The job involves moderate physical effort, such as standing for long periods, occasional lifting, or repetitive or monotonous movements.", "Moderate physical effort. The job requires consistent physical effort, such as regular lifting of moderate weight, manual handling of materials, prolonged standing or walking or monotonous or repetitive hand/arm movements.", "High physical effort. The job requires frequent heavy lifting, physically demanding and repetitive tasks, or prolonged exposure to physically tough conditions.", "Extreme physical effort. The job requires continuous heavy and/or physical effort, often in challenging conditions, including lifting heavy loads, extensive manual labour, physically demanding environments, or tasks that involve sustained, monotonous motion with little opportunity for rest or variation."]}, {"id": "environment", "name": "Environment (physical, psychological or emotional)", "q": "What difficult conditions does the job expose you to (noise, hazards, aggression, stress)?", "levels": ["Not applicable. No exposure to unpleasant, dangerous or challenging physical, psychological or emotional working conditions, and no risk of injury or health issues.", "Minimal exposure to hazards or stress. The job involves little or no exposure to physical hazards (e.g. chemicals, moving equipment, noise) and minimal emotional or psychological risks (e.g. occasional routine tasks with no emotional burden). There is minor exposure to dust, dirt, fumes, noise, waste, poor lighting, etc.", "Occasional exposure to hazards or stress. The job involves occasional exposure to mild physical risks (e.g. working with light machinery, occasional noise) or psychosocial risks (e.g. occasional interpersonal conflict or minor repetitive tasks). Exposure occurs two to three times a year.", "Regular exposure to hazards or stress. The job requires regular exposure to physical hazards psychological risks (e.g. isolation, repetitive tasks or occasional threats of violence). It may occur monthly or as a build-up of milder hazards.", "Frequent exposure to significant hazards or stress. The job involves frequent exposure to physical risks (e.g. working in high-risk environments, regularly handling chemicals or from safety risks such as cuts or abrasions) and significant psychosocial risks (e.g. handling threats of violence, harassment or prolonged exposure to high-pressure situations).", "Constant exposure to extreme hazards or stress. The job requires continuous exposure to severe physical hazards (e.g. handling dangerous chemicals, working with heavy machinery or significant risk of injury) and high-level psychosocial risks (e.g. high emotional strain, constant exposure to harassment or working in crisis situations)."]}, {"id": "organisational", "name": "Organisational environment", "q": "What organisational demands does the job bring (hours, travel, on-call, being connected)?", "levels": ["Not applicable. The job does not involve irregular working hours, travel or other organisational demands.", "Minimal organisational demands. The job requires standard working hours with no night shifts or irregular schedules. There is little or no need for travel or digital connectivity beyond typical working hours.", "Occasional organisational demands. The job may involve occasional irregular hours (e.g. the requirement to work weekends or holidays), minimal travel or limited digital connectivity outside normal working hours.", "Regular organisational demands. The job requires regular shift work, night shifts or irregular hours and involves moderate travel or frequent digital connectivity after hours.", "Frequent organisational demands. The job requires frequent night shifts, irregular working hours and extended periods of digital connectivity. Regular travel between locations or to external workplaces is also required.", "Constant organisational demands. The job involves constant exposure to irregular working hours, frequent night shifts, extensive travel (both local and international) and ongoing digital connectivity, often requiring work outside normal hours, including weekends and public holidays."]}],

    eige: [{"id": "knowledge", "name": "Connaissances", "q": "Quel niveau de connaissances le poste exige-t-il ?", "levels": ["Sans objet.", "Connaissances générales de base. Le poste demande des connaissances de base pour réaliser des tâches simples.", "Connaissances factuelles de base dans un domaine de travail. Le poste demande un raisonnement simple et des connaissances pratiques pour utiliser l’information, réaliser des tâches et résoudre des problèmes courants à l’aide de règles et d’outils simples.", "Connaissance des faits, principes et notions générales d’un domaine. Le poste demande une gamme de savoirs intellectuels et pratiques pour réaliser des tâches et résoudre des problèmes en choisissant et en appliquant des méthodes, outils, matériaux et informations de base.", "Connaissances factuelles et théoriques dans des contextes larges d’un domaine de travail. Le poste demande une gamme de savoirs intellectuels et pratiques pour trouver des solutions à des problèmes précis du domaine.", "Connaissances spécialisées et théoriques dans un domaine, avec conscience de leurs limites. Le poste demande une gamme étendue de savoirs intellectuels et pratiques pour imaginer des solutions créatives à des problèmes abstraits.", "Connaissances avancées d’un domaine, avec une compréhension approfondie des théories et des principes. Le poste demande un haut niveau de connaissances et d’expertise pour résoudre des problèmes complexes et imprévus dans un domaine spécialisé.", "Connaissances très spécialisées, y compris les idées les plus récentes du domaine. Le poste demande une conscience approfondie des enjeux de connaissance dans un domaine et entre domaines, et des compétences spécialisées de recherche et d’innovation pour créer des savoirs et combiner des connaissances de différents domaines.", "Connaissances du plus haut niveau dans un domaine et à la frontière entre domaines. Le poste demande les connaissances les plus avancées et spécialisées, y compris la capacité de combiner et d’évaluer des idées, pour résoudre des problèmes critiques de recherche et d’innovation et faire évoluer les connaissances ou la pratique professionnelle."]}, {"id": "communication", "name": "Compétences relationnelles et de communication", "q": "Quel niveau de communication et de relation avec les autres le poste exige-t-il ?", "levels": ["Sans objet.", "Compétences de communication et relationnelles de base. Le poste demande de transmettre clairement des informations simples et de faire preuve de courtoisie et de respect dans des échanges simples.", "Communication et échanges courants. Le titulaire communique avec des collègues ou des clients dans des cadres structurés. Tact, empathie et capacité à nouer une relation de base sont nécessaires.", "Communication efficace et bonnes relations de travail. Le titulaire adapte sa communication à différents publics et favorise la confiance, la coopération et de bonnes relations de travail.", "Compétences de communication et relationnelles avancées. Le titulaire gère des échanges complexes, joue un rôle de médiation dans des conflits et soutient la collaboration au sein d’un groupe.", "Compétences de communication et relationnelles de haut niveau. Le titulaire conduit des stratégies de communication, influence les décisions, gère des communications complexes et crée un climat inclusif et de confiance qui entraîne et inspire les autres."]}, {"id": "problemSolving", "name": "Résolution de problèmes", "q": "Quel niveau de résolution de problèmes le poste exige-t-il ?", "levels": ["Sans objet. Le poste ne demande aucune résolution de problèmes : les tâches sont routinières et ne demandent ni jugement autonome ni solution.", "Problèmes courants. Le poste demande de résoudre de petits problèmes routiniers et réguliers. Les solutions sont connues et faciles à appliquer.", "Problèmes standards. Le poste demande de résoudre des problèmes pour lesquels des options sont définies. Un certain jugement est nécessaire, mais de l’aide est généralement disponible.", "Problèmes variables. Le poste demande de traiter différents types de problèmes qui exigent une réflexion attentive, la recherche de plusieurs options ou l’adaptation des façons de faire. L’appui et les ressources peuvent être limités.", "Problèmes non standards. Le poste demande de résoudre des problèmes complexes et inhabituels, avec de nombreux éléments à prendre en compte. Les solutions demandent souvent une analyse approfondie et l’adaptation des méthodes existantes.", "Problèmes complexes. Le titulaire doit résoudre des problèmes très complexes et uniques, sans solution claire ou prédéfinie. Des solutions innovantes sont nécessaires, ce qui demande un esprit critique."]}, {"id": "planning", "name": "Planification et organisation", "q": "Quel niveau de planification et d’organisation le poste exige-t-il ?", "levels": ["Sans objet. Le poste ne demande aucune compétence de planification ou d’organisation.", "Planification limitée. Les tâches sont fixées par d’autres ou prédéfinies, avec peu de besoin d’ajustement.", "Organisation de base. Le poste demande de planifier et d’organiser son propre travail dans des délais fixés, avec une part de choix dans le calendrier et les priorités.", "Organisation moyenne. Le poste demande d’organiser et de hiérarchiser plusieurs tâches et d’ajuster les plans selon les circonstances ou les échéances.", "Organisation avancée. Le poste demande de planifier et de gérer des tâches ou des calendriers complexes qui se chevauchent, avec une certaine autonomie, de la planification partagée et la gestion des interdépendances entre équipes ou services.", "Planification et organisation de haut niveau. Le poste demande d’élaborer des plans stratégiques à long terme et de gérer l’incertitude, avec une grande autonomie, pour définir l’orientation de l’organisation."]}, {"id": "physicalSkills", "name": "Habiletés physiques", "q": "Quel niveau d’habileté physique (dextérité, précision, coordination) le poste exige-t-il ?", "levels": ["Sans objet. Le poste ne demande pas d’habileté physique particulière (même s’il comporte sans doute une certaine activité physique).", "Habiletés physiques minimales. Le poste demande des habiletés physiques de base, comme manipuler des objets légers ou utiliser des outils simples.", "Habiletés physiques de base. Le poste demande des habiletés physiques avec un effort léger à modéré, et une dextérité un peu supérieure à celle de la vie courante. Des manipulations peuvent être nécessaires, sans exigence de précision.", "Habiletés physiques moyennes. Le poste demande plus que des gestes de base, par exemple manier avec soin des outils fins, des matériaux ou des personnes. Dextérité et coordination œil-main sont généralement nécessaires, avec un besoin de précision et/ou de rapidité.", "Habiletés physiques élevées. Le poste demande souvent un effort physique et des gestes ou techniques avancés dans des conditions exigeantes, avec en général une coordination œil-main et sensorielle fine et/ou de la rapidité.", "Habiletés physiques expertes. Le poste demande des habiletés physiques d’expert, souvent dans des conditions particulières : coordination, précision, endurance ou rapidité de haut niveau, et une dextérité fine des mains ou des doigts qui est au cœur du poste."]}, {"id": "people", "name": "Responsabilité envers les personnes", "q": "Quelle responsabilité le poste a-t-il envers d’autres personnes (encadrement, accompagnement, soin, bien-être) ?", "levels": ["Sans objet. Le poste n’a aucune responsabilité envers des personnes.", "Très limitée. Pas d’encadrement ni de rôle de soin. Le poste peut apporter une aide ou une orientation de base, par exemple en aidant de nouveaux collègues à s’intégrer.", "Responsabilité de base. Le poste apporte soutien, conseils ou orientation à des personnes ou à de petites équipes : aide au développement, tutorat informel, accompagnement dans des tâches. Il peut contribuer au sentiment de sécurité et de confort des autres, avec peu de pouvoir de décision et sans être responsable des résultats.", "Responsabilité moyenne. Le poste supervise ou coordonne le travail et le bien-être d’autres personnes : encadrement, soutien régulier, gestion des conflits, réponse aux besoins individuels et développement personnel et professionnel des personnes.", "Responsabilité élevée. Le poste porte une responsabilité importante pour le bien-être et le développement d’autres personnes, avec des décisions qui touchent leur emploi, leurs tâches ou leur bien-être : gérer une équipe, soigner, enseigner, garantir la sécurité psychologique. Cela peut inclure recruter, évaluer, motiver, accompagner et diriger.", "Responsabilité complète. Le poste est pleinement responsable du bien-être et du développement d’autres personnes (y compris des patients ou des enfants) et/ou de la direction et de la gestion d’autres personnes : fixer des objectifs, prendre des décisions stratégiques, recruter, licencier, évaluer, former, réviser et fixer les rémunérations et les effectifs, ou gérer des dispositifs de soin complexes. Il porte la responsabilité de l’ensemble du personnel d’une organisation ou d’une partie importante d’une grande organisation."]}, {"id": "goods", "name": "Responsabilité des biens et équipements", "q": "Quelle responsabilité le poste a-t-il pour les biens, le matériel et les équipements ?", "levels": ["Sans objet. Le poste n’a aucune responsabilité pour des biens ou des équipements.", "Responsabilité limitée. Le poste prend soin et fait bon usage d’outils ou de matériaux de faible valeur, avec peu de responsabilité pour leur entretien ou leur sécurité.", "Une certaine responsabilité. Le poste utilise et entretient du matériel ou des stocks et veille à ce qu’ils soient utilisés correctement et en sécurité.", "Responsabilité moyenne. Le poste utilise et entretient régulièrement du matériel ou des matériaux de plus grande valeur, et peut gérer des ressources ou veiller à leur bon état.", "Responsabilité importante. Le poste supervise des ressources de valeur, veille à leur sécurité, leur entretien et leur bon fonctionnement, et décide des commandes de matériel et de fournitures.", "Responsabilité complète. Le poste gère tout le cycle de vie des biens ou équipements (achat, entretien, sécurité, élimination), y compris des actifs de grande valeur ou sensibles, et planifie les besoins à long terme."]}, {"id": "information", "name": "Responsabilité de l’information", "q": "Quelle responsabilité le poste a-t-il pour l’information, notamment confidentielle ?", "levels": ["Sans objet. Le poste n’a aucune responsabilité pour l’information.", "Responsabilité très limitée. Le poste utilise des informations de base pour réaliser ses tâches, avec peu ou pas de responsabilité pour leur recherche, leur traitement ou leur protection.", "Responsabilité limitée. Le poste recueille, traite ou transmet des informations de façon encadrée, en suivant des consignes ou des procédures définies.", "Responsabilité moyenne. Le poste gère des informations pour en garantir l’exactitude, la qualité et la sécurité. Le titulaire peut décider du traitement de données sensibles.", "Responsabilité importante. Le poste gère de grands volumes d’informations de valeur ou sensibles : il décide de ce qui est nécessaire et de son usage, et veille à leur protection.", "Responsabilité complète. Le poste a la responsabilité principale de la recherche, de l’analyse et de l’usage de l’information, veille au respect des règles légales et stratégiques, et supervise la gestion de l’information dans toute l’organisation."]}, {"id": "financial", "name": "Responsabilité des ressources financières", "q": "Quelle responsabilité le poste a-t-il pour l’argent et les budgets ?", "levels": ["Sans objet. Le poste n’a aucune responsabilité pour des ressources financières.", "Responsabilité très limitée. Le poste manipule de petites sommes ou traite des opérations simples, comme enregistrer des dépenses ou tenir des documents financiers de base.", "Responsabilité limitée. Le poste gère des ressources financières limitées, par exemple de petits budgets ou des factures, ou participe à des échanges sur la planification financière.", "Responsabilité moyenne. Le poste gère des ressources financières importantes : gestion de budgets, suivi des dépenses, responsabilité des engagements et participation aux décisions financières.", "Responsabilité importante. Le poste gère de gros budgets ou portefeuilles financiers, décide des affectations ou veille à l’intégrité financière d’un service ou de l’organisation, parfois en lien avec les auditeurs ou les responsables financiers.", "Responsabilité complète. Le poste porte la responsabilité entière de la planification et du contrôle financiers de l’organisation : fixer les budgets, définir les politiques financières, prendre des décisions financières stratégiques et assurer les relations avec les organismes financiers externes ou les auditeurs."]}, {"id": "mentalEffort", "name": "Effort mental", "q": "Quel niveau de concentration et d’effort mental le poste exige-t-il ?", "levels": ["Sans objet. Le poste ne demande pas d’effort mental ou de concentration notables.", "Effort mental limité. Les tâches ne demandent qu’un faible effort mental, comme une attention de base et le suivi de consignes simples, avec peu de sollicitations simultanées.", "Effort mental moyen. Les tâches demandent de la concentration, comme analyser des informations simples ou réaliser des tâches répétitives qui exigent de l’attention aux détails.", "Effort mental élevé. Le poste demande souvent de se concentrer sur des tâches complexes qui exigent un effort mental important, comme interpréter des données complexes.", "Effort mental très élevé. Le poste demande une concentration continue de haut niveau, avec peu ou pas de pauses, sur des tâches intellectuellement exigeantes.", "Effort mental intense. Le poste demande un effort mental soutenu et intense pendant de longues périodes, souvent avec de la réflexion créative et la gestion de problèmes complexes ou nouveaux."]}, {"id": "emotionalEffort", "name": "Effort psychosocial et émotionnel", "q": "Quel effort émotionnel le poste exige-t-il pour gérer ses propres émotions et réactions ?", "levels": ["Sans objet. Le poste ne demande aucun effort psychosocial ou émotionnel.", "Effort minimal. Il n’y a presque jamais besoin de gérer ses réactions émotionnelles ; le poste expose très peu à des situations émotionnellement exigeantes.", "Effort occasionnel. Le poste implique parfois des situations émotionnellement exigeantes, comme gérer de petits conflits ou des personnes contrariées.", "Effort moyen. Le poste demande de gérer régulièrement ses réactions émotionnelles, par exemple face à des personnes ou des situations sensibles ou difficiles.", "Effort élevé. Le poste expose souvent à des situations chargées d’émotion, qui demandent une forte résilience et la maîtrise de ses propres émotions dans les échanges avec les autres.", "Effort extrême. Le poste expose en permanence à des circonstances très émotionnelles ou stressantes, qui demandent une maîtrise émotionnelle continue et la capacité d’accompagner des personnes très sensibles, vulnérables ou en détresse."]}, {"id": "physicalEffort", "name": "Effort physique", "q": "Quel effort physique (force, endurance) le poste exige-t-il ?", "levels": ["Sans objet. Le poste ne demande aucun effort physique.", "Effort physique minimal. Le poste comporte des tâches physiques légères, comme soulever ou déplacer de temps en temps des objets légers.", "Effort physique faible. Le poste demande un effort modéré, comme rester longtemps debout, soulever des charges de temps en temps, ou des gestes répétitifs ou monotones.", "Effort physique moyen. Le poste demande un effort constant, comme soulever régulièrement des charges moyennes, manutentionner, rester longtemps debout ou marcher, ou des gestes répétitifs des mains ou des bras.", "Effort physique élevé. Le poste demande souvent de soulever des charges lourdes, des tâches physiquement exigeantes et répétitives, ou une exposition prolongée à des conditions physiquement difficiles.", "Effort physique extrême. Le poste demande un effort lourd et/ou continu, souvent dans des conditions difficiles : port de charges lourdes, travail manuel intensif, environnement physiquement exigeant, ou gestes monotones prolongés avec peu de repos ou de variété."]}, {"id": "environment", "name": "Environnement (physique, psychologique ou émotionnel)", "q": "À quelles conditions difficiles le poste expose-t-il (bruit, risques, agressions, stress) ?", "levels": ["Sans objet. Aucune exposition à des conditions de travail physiques, psychologiques ou émotionnelles désagréables, dangereuses ou difficiles, et aucun risque de blessure ou de problème de santé.", "Exposition minimale aux risques ou au stress. Peu ou pas d’exposition à des risques physiques (produits chimiques, machines en mouvement, bruit) et des risques émotionnels ou psychologiques minimes. Exposition mineure à la poussière, à la saleté, aux fumées, au bruit, aux déchets, à un mauvais éclairage, etc.", "Exposition occasionnelle aux risques ou au stress. Exposition occasionnelle à de légers risques physiques (petites machines, bruit occasionnel) ou psychosociaux (conflits ponctuels, petites tâches répétitives), deux à trois fois par an.", "Exposition régulière aux risques ou au stress. Exposition régulière à des risques physiques ou psychologiques (isolement, tâches répétitives, menaces de violence occasionnelles), par exemple chaque mois ou par accumulation de risques plus légers.", "Exposition fréquente à des risques ou à un stress importants. Exposition fréquente à des risques physiques (environnements à haut risque, manipulation régulière de produits chimiques, coupures ou écorchures) et à des risques psychosociaux importants (menaces de violence, harcèlement, forte pression prolongée).", "Exposition constante à des risques ou à un stress extrêmes. Exposition continue à des risques physiques graves (produits chimiques dangereux, machines lourdes, risque important de blessure) et à des risques psychosociaux élevés (forte charge émotionnelle, harcèlement constant, situations de crise)."]}, {"id": "organisational", "name": "Environnement organisationnel", "q": "Quelles contraintes d’organisation le poste impose-t-il (horaires, déplacements, astreintes, connexion) ?", "levels": ["Sans objet. Le poste ne comporte ni horaires irréguliers, ni déplacements, ni autre contrainte d’organisation.", "Contraintes minimales. Horaires standards, sans travail de nuit ni horaires irréguliers, et peu ou pas de déplacements ou de connexion numérique en dehors des heures habituelles.", "Contraintes occasionnelles. Le poste peut demander parfois des horaires irréguliers (week-ends, jours fériés), peu de déplacements ou une connexion limitée en dehors des heures normales.", "Contraintes régulières. Le poste demande régulièrement du travail posté, de nuit ou en horaires irréguliers, avec des déplacements modérés ou une connexion numérique fréquente après les heures de travail.", "Contraintes fréquentes. Le poste demande souvent du travail de nuit, des horaires irréguliers et de longues périodes de connexion numérique, ainsi que des déplacements réguliers entre sites ou vers des lieux de travail extérieurs.", "Contraintes constantes. Le poste expose en permanence à des horaires irréguliers, des nuits fréquentes, des déplacements nombreux (locaux et internationaux) et une connexion continue, souvent en dehors des heures normales, y compris le week-end et les jours fériés."]}],

    skillHint: 'Sous-critère : celui des cinq sous-critères du facteur « compétences » de la boîte à outils européenne de cotation des emplois dont la compétence est une preuve. JobEval affiche la compétence, son importance et ses tâches liées sous ce sous-critère. Laissez vide si aucun ne convient, par exemple pour une qualité personnelle comme la rigueur, qui relève de l’effort et non des compétences.', removeComp: 'Supprimer la compétence',

    twoWaysTitle: 'Deux façons de recueillir les notes',
    twoWaysBody: '1. <b>Envoyer des fichiers.</b> Enregistrez le fichier d’un référent et envoyez-le-lui par e-mail. Il ouvre cet outil, choisit <i>Ouvrir un fichier</i>, note, puis vous renvoie le fichier qu’il enregistre. Vous ouvrez ce fichier ici et ses notes sont ajoutées. Un fichier de référent ne contient jamais les notes des autres.<br>2. <b>Les saisir vous-même.</b> Recueillez les notes sur les fiches de travail imprimables ou en entretien, puis saisissez-les à l’étape Notation.',

    csv: function () { exportFile(slug(p.job.title) + t('fnResults'), '﻿' + csv(), 'text/csv'); },
    // Hand-off to JobEval. On the same site (both apps on jfeg1.github.io) the project goes through this browser's storage,
    // and JobEval imports it when it opens. Anywhere else (a file on disk), save the project file to import in JobEval.
    sendJobEval: function () {
      var url = 'https://jfeg1.github.io/JobEval/#/evaluate';
      if (location.origin === 'https://jfeg1.github.io') {
        try {
          var q = JSON.parse(localStorage.getItem('jobeval-inbox') || '[]'); if (!Array.isArray(q)) q = [];
          q = q.filter(function (x) { return !x || x.id !== p.id; }); q.push(p);
          localStorage.setItem('jobeval-inbox', JSON.stringify(q));
          window.open(url, '_blank', 'noopener'); toast(t('sentJobEval')); return;
        } catch (e) { /* storage full or blocked: fall back to the file */ }
      }
      acts.saveFile(); if (!framed) window.open(url, '_blank', 'noopener'); toast(t('sentJobEvalFile'));
    },
    romeOpen: function () {
      ROME.ui.open = true; ROME.ui.code = null; ROME.ui.status = ROME.index ? '' : 'loading'; rerenderRome();
      if (!ROME.index) romeLoadIndex(function (e) { ROME.ui.status = e ? 'error' : ''; rerenderRome(); });
    },
    romeClose: function () { ROME.ui.open = false; ROME.ui.code = null; ROME.ui.status = ''; rerenderRome(); },
    romeBack: function () { ROME.ui.code = null; rerenderRome(); },
    romePick: function (el) { var code = el.dataset.code; withFiche(code, null, function () { ROME.ui.code = code; rerenderRome(); }); rerenderRome(); },
    romeViewChosen: function () { var jr = p.job.rome; ROME.ui.open = true; withFiche(jr.code, jr.version, function () { ROME.ui.code = jr.code; rerenderRome(); }); rerenderRome(); },
    romeUse: function () { var f = ROME.fiches[ROME.ui.code]; if (!f) return; romeRecord(f); ROME.ui.open = false; ROME.ui.code = null; store(); render(); toast(t('romeUsed')); },
    romeImport: function () {
      var code = ROME.ui.open && ROME.ui.code ? ROME.ui.code : (p.job.rome && p.job.rome.code), v = ROME.ui.open && ROME.ui.code ? null : (p.job.rome && p.job.rome.version);
      if (!code) return;
      withFiche(code, v, function (f) { rerenderRome(); importDialog(f); });
    },
    romeTickCore: function () { Array.prototype.forEach.call(document.querySelectorAll('#modalBox input[data-rk]:not([disabled])'), function (c) { var it = ROME.ui.items.filter(function (x) { return x.key === c.dataset.rk; })[0]; c.checked = !!(it && it.core); }); romeCount(); },
    romeTickNone: function () { Array.prototype.forEach.call(document.querySelectorAll('#modalBox input[data-rk]'), function (c) { c.checked = false; }); romeCount(); },
    romeDoImport: function () {
      var f = ROME.fiches[ROME.ui.importCode]; if (!f) return;
      var chosen = ROME.ui.items.filter(function (it) { var c = document.querySelector('#modalBox input[data-rk="' + it.key + '"]'); return c && c.checked && !c.disabled; }).map(function (it) {
        var sel = document.querySelector('#modalBox select[data-ras="' + it.key + '"]'); return Object.assign({}, it, { as: sel ? sel.value : it.as });
      });
      if (!p.job.rome || p.job.rome.code !== f.code) romeRecord(f);
      var r = Core.importRome(p, f.code, p.job.rome.version, chosen, t('romeSource', { code: f.code }));
      closeModal(); ROME.ui.open = false; ROME.ui.code = null; store();
      state.view = chosen.some(function (x) { return x.as === 'task'; }) ? 'tasks' : 'competencies'; render(); toast(t('romeImported', { a: r.added, s: r.skipped }));
    }
  };
  function focusLast(sel) { var els = document.querySelectorAll(sel); if (els.length) els[els.length - 1].focus(); }
  document.addEventListener('click', function (e) {
    var lb = e.target.closest('[data-lang]'); if (lb) { setLang(lb.dataset.lang); return; }
    var v = e.target.closest('[data-view]'); if (v) { state.view = v.dataset.view; render(); return; }
    var a = e.target.closest('[data-act]'); if (a && !a.disabled && acts[a.dataset.act]) acts[a.dataset.act](a);
    if (e.target.id === 'modal') closeModal();
  });
  function onEdit(e) {
    var el = e.target;
    if (el.dataset.rome === 'q') { if (e.type !== 'input') return; ROME.ui.q = el.value; var rr = $('romeResults'); if (rr) rr.innerHTML = romeResults(); return; }
    if (el.dataset.rk) { romeCount(); return; }
    if (el.dataset.ras) return;
    if (el.dataset.path) {
      setPath(el.dataset.path, el.dataset.check ? el.checked : el.dataset.num ? (el.value === '' ? Core.DEFAULT_CUTOFFS[el.dataset.path.split('.')[1]] : Number(el.value)) : el.value);
      // Editing the wording of an item imported from the ROME marks it as reviewed.
      var m = /^(tasks|competencies)\.(\d+)\.(text|name|definition)$/.exec(el.dataset.path), item = m && p[m[1]][+m[2]];
      if (item && item.origin && item.origin.edited === false) item.origin.edited = true;
      store(); if (el.dataset.rerender) { var y = window.scrollY; render(); window.scrollTo(0, y); } if (el.dataset.path === 'job.title') $('jobName').textContent = p.job.title ? '· ' + p.job.title : ''; return;
    }
    if (e.type !== 'change') return;
    if (el.dataset.pick === 'rater') { state.raterId = el.value; render(); return; }
    if (el.dataset.rate) {
      var parts = el.dataset.rate.split(':'), r = curRater(); if (!r) return;
      var val = el.value === '' ? undefined : Number(el.value);
      if (parts[0] === 'e') { r.e = r.e || {}; if (val === undefined) delete r.e[parts[1]]; else r.e[parts[1]] = val; el.title = val === undefined ? '' : el.options[el.selectedIndex].title; store(); progress(); return; }
      var scl = sc({ t: { imp: 'taskImp', freq: 'taskFreq' }, c: { imp: 'compImp', entry: 'compEntry', dv: 'compDV' }, l: { v: 'link' } }[parts[0]][parts[2]]);
      if (scl) el.title = val === undefined ? '' : val + ' – ' + scl.opts[val];
      if (parts[0] === 'l') { if (val === undefined) delete r.l[parts[1]]; else r.l[parts[1]] = val; }
      else { var o = r[parts[0]][parts[1]] = r[parts[0]][parts[1]] || {}; if (val === undefined) delete o[parts[2]]; else o[parts[2]] = val; }
      store(); progress();
      var ls = $('linkSummary'); if (ls) ls.innerHTML = linkSummary();
    }
  }
  document.addEventListener('input', onEdit); document.addEventListener('change', onEdit);
  $('file').addEventListener('change', function () {
    var f = this.files[0]; if (!f) return; var rd = new FileReader();
    rd.onload = function () { try { openProject(JSON.parse(rd.result)); } catch (e) { toast(t('cantRead')); } }; rd.readAsText(f);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
  window.__oja = { open: openProject, get: function () { return p; }, lang: function () { return ui; }, setLang: setLang, csv: csv };
  applyStatic();
  render();
})();
</script>
